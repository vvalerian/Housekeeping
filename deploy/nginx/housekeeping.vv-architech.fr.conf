# Vhost nginx pour https://housekeeping.vv-architech.fr
# À copier dans /etc/nginx/sites-available/ puis activer par symlink —
# marche à suivre complète dans deploy/README.md.
#
# ⚠ SÉCURITÉ : garder le bloc `auth_basic` tant que le premier compte
# employeur n'a pas été créé sur /admin (deploy/README.md §3). Une fois
# l'authentification applicative en place (comptes + PIN tablette, lot 3),
# retirer les deux lignes auth_basic et recharger nginx.

server {
    listen 80;
    listen [::]:80;
    server_name housekeeping.vv-architech.fr;

    # Renouvellement des certificats Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx >= 1.25.1 : remplacer par « listen 443 ssl; » + « http2 on; ».
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name housekeeping.vv-architech.fr;

    # Chemins standard certbot — `certbot --nginx` les remplit tout seul si
    # vous partez du bloc 80 seulement (cf. deploy/README.md, voie A).
    ssl_certificate /etc/letsencrypt/live/housekeeping.vv-architech.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/housekeeping.vv-architech.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Authentification transitoire (à retirer au lot 3) :
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/htpasswd-housekeeping <utilisateur>
    auth_basic "Housekeeping";
    auth_basic_user_file /etc/nginx/htpasswd-housekeeping;

    client_max_body_size 1m;

    # Assets Vite empreints (immutables) : cache long côté navigateur.
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
