# Vhost nginx pour https://housekeeping.vv-architech.fr
# À copier tel quel dans /opt/homebrew/etc/nginx/conf.d/ (nginx Homebrew du
# Mac du foyer) — marche à suivre complète dans deploy/README.md.
#
# Le port 80 et la redirection HTTPS sont gérés globalement par
# conf.d/00-http.conf ; le TLS réutilise le certificat wildcard
# *.vv-architech.fr partagé par les autres sous-domaines de la machine.
#
# ⚠ SÉCURITÉ : garder les deux lignes `auth_basic` tant que le premier compte
# employeur n'a pas été créé sur /admin (deploy/README.md §3). Une fois
# l'authentification applicative en place (comptes + PIN tablette, lot 3),
# les retirer et recharger nginx.

server {
    listen 443 ssl;
    server_name housekeeping.vv-architech.fr;

    ssl_certificate     /opt/homebrew/etc/nginx/ssl/vv-architech.fr/fullchain.pem;
    ssl_certificate_key /opt/homebrew/etc/nginx/ssl/vv-architech.fr/privkey.pem;

    access_log /opt/homebrew/var/log/nginx/housekeeping.access.log;
    error_log  /opt/homebrew/var/log/nginx/housekeeping.error.log;

    # Authentification transitoire (fenêtre d'installation) :
    #   htpasswd -c /opt/homebrew/etc/nginx/housekeeping.htpasswd <utilisateur>
    auth_basic           "Housekeeping";
    auth_basic_user_file /opt/homebrew/etc/nginx/housekeeping.htpasswd;

    client_max_body_size 1m;

    # Les dossiers temporaires de nginx (/opt/homebrew/var/run/nginx/*_temp)
    # appartiennent à `nobody` alors que les workers tournent sous l'utilisateur
    # courant : toute réponse plus grosse que les buffers mémoire serait
    # tronquée (bundle JS de 400 Ko coupé à 130 Ko). Streaming direct, comme
    # les autres vhosts de la machine.
    proxy_buffering off;

    # Le conteneur écoute sur 127.0.0.1:3010 (HOUSEKEEPING_PORT du .env :
    # 3000 est déjà pris sur cette machine par le site vv-architech.fr).

    # Assets Vite empreints (immutables) : cache long côté navigateur.
    location /assets/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
